# Replace names and certificate paths. A trusted certificate is required for mobile PWA.
server {
    listen 443 ssl;
    server_name ops.example.invalid;
    ssl_certificate /etc/ssl/ops/fullchain.pem;
    ssl_certificate_key /etc/ssl/ops/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 128k;
    location / {
        proxy_pass https://127.0.0.1:18443;
        proxy_ssl_trusted_certificate /etc/server-aibot/tls.crt;
        proxy_ssl_name localhost;
        proxy_ssl_verify on;
        proxy_set_header Host $http_host;
        proxy_read_timeout 120s;
    }
}
server {
    listen 443 ssl;
    server_name agents.example.invalid;
    ssl_certificate /etc/ssl/agents/fullchain.pem;
    ssl_certificate_key /etc/ssl/agents/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    location = /rpc/ws {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }
    location ~ ^/api/v1/public/frp/(login|newProxy|closeProxy|ping|newWorkConn|newUserConn|visitorP2P)$ {
        proxy_pass http://127.0.0.1:18081;
    }
    location / { return 404; } # Never publish /control.
}
